<style>
  #market-flow-replay .communications-section { margin:14px 0 17px; border-top:3px solid var(--mf-red); padding-top:9px; }
  #market-flow-replay .comm-kicker { color:var(--mf-red); font-size:10px; letter-spacing:1.5px; margin-bottom:3px; }
  #market-flow-replay .communications-section h2 { font-size:18px; }
  #market-flow-replay .comm-summary { padding:3px 0 7px; font-size:12px; line-height:1.6; }
  #market-flow-replay .comm-summary strong { font-size:18px; font-weight:500; color:var(--mf-red); }
  #market-flow-replay .comm-relative { font-size:12px; margin:0 0 8px; }
  #market-flow-replay .comm-scroll { overflow-x:auto; }
  #market-flow-replay .comm-table { min-width:690px; }
  #market-flow-replay .comm-table th:first-child { width:23%; }
  #market-flow-replay .comm-table th:last-child { width:20%; }
  #market-flow-replay .comm-table td { padding:5px 7px; }
  #market-flow-replay .comm-table small { display:block; font-size:10px; color:var(--mf-gray); margin-top:2px; }
  #market-flow-replay .comm-select { padding:0; border:0; cursor:pointer; font-size:13px; }
  #market-flow-replay .comm-state { font-size:11px; }
  #market-flow-replay .comm-detail { display:grid; grid-template-columns:1.15fr 1.25fr .9fr; gap:20px; margin-top:12px; border-bottom:1px solid var(--mf-rule); padding-bottom:10px; }
  #market-flow-replay .comm-detail h3 { margin:0 0 5px; font-size:13px; font-weight:500; }
  #market-flow-replay .comm-detail p { margin:4px 0; font-size:11px; line-height:1.55; }
  #market-flow-replay .comm-fund-split b { font-weight:500; white-space:nowrap; }
  #market-flow-replay .comm-days { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:4px; margin-top:7px; }
  #market-flow-replay .comm-day { text-align:center; padding:4px 1px; background:#f1eeea; font-size:10px; }
  #market-flow-replay .comm-day time,#market-flow-replay .comm-day strong,#market-flow-replay .comm-day span { display:block; font-weight:400; }
  #market-flow-replay .comm-day time { color:var(--mf-gray); margin-bottom:3px; }
  #market-flow-replay .comm-source { font-size:10px; color:var(--mf-red); text-decoration:none; }
  #market-flow-replay .comm-stock-list a { color:var(--mf-ink); text-decoration:none; display:grid; grid-template-columns:1fr auto; gap:3px; padding:6px 0; border-bottom:1px solid var(--mf-rule); font-size:11px; }
  #market-flow-replay .comm-stock-list a>small { grid-column:1/-1; color:var(--mf-gray); font-size:10px; }
  #market-flow-replay .comm-stock-list b { font-weight:500; }
  #market-flow-replay .comm-scope,#market-flow-replay .comm-health { font-size:10px; line-height:1.5; color:var(--mf-gray); margin-top:5px; }
  @media(max-width:760px) { #market-flow-replay .comm-detail { grid-template-columns:1fr; gap:13px; } #market-flow-replay .comm-table { min-width:650px; } }
  @media print { #market-flow-replay .communications-section { break-inside:avoid; } }
</style>
<section class="communications-section" aria-label="固定通信与算力细分观察">
  <div class="section-head"><div><div class="comm-kicker">FOCUS / COMMUNICATIONS & AI INFRASTRUCTURE</div><h2>通信与算力 · 固定细分观察</h2></div><span class="muted comm-asof">等待行情</span></div>
  <div class="comm-summary" role="status"></div>
  <p class="comm-relative"></p>
  <div class="comm-scroll"><table class="comm-table" aria-label="六个固定通信细分的价资强弱，资金单位亿元"><thead><tr><th>细分方向</th><th>今日涨跌幅</th><th>主力净额 / 亿</th><th>5日涨跌幅</th><th>5日净额 / 亿</th><th>流入天数</th><th>量价观察</th></tr></thead><tbody></tbody></table></div>
  <div class="comm-detail" aria-live="polite"></div>
  <p class="comm-health"></p><p class="comm-scope"></p>
</section>
